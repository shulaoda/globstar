[workspace]
resolver = "2"
members = [
    "crates/globstar",
    "crates/globstar-walk",
    "tools/difftest",
    "tools/ecosystem",
    "tools/memory-check",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/shulaoda/globstar"

[workspace.dependencies]
globstar = { path = "crates/globstar", version = "0.0.6" }

[profile.release]
lto = "thin"
codegen-units = 1

# The fuzzer's build: release speed with the debug checks on, so it
# also catches `debug_assert!` and overflow failures.
[profile.fuzz]
inherits = "release"
debug-assertions = true
overflow-checks = true
