name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Tag matches every manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_V="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          CORE_V="$(node -p "require('./packages/globstar/package.json').version")"
          WALK_V="$(node -p "require('./packages/globstar-walk/package.json').version")"
          echo "tag=$TAG cargo=$CARGO_V core=$CORE_V walk=$WALK_V"
          test "$TAG" = "$CARGO_V" && test "$TAG" = "$CORE_V" && test "$TAG" = "$WALK_V"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Cross-runtime corpora
        run: just verify

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm -r publish --access public --no-git-checks

  github-release:
    needs: [publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
