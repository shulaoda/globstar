name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: just

      - name: Tag matches every manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_V="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          CORE_V="$(node -p "require('./packages/globstar/package.json').version")"
          WALK_V="$(node -p "require('./packages/globstar-walk/package.json').version")"
          echo "tag=$TAG cargo=$CARGO_V core=$CORE_V walk=$WALK_V"
          test "$TAG" = "$CARGO_V" && test "$TAG" = "$CORE_V" && test "$TAG" = "$WALK_V"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Cross-runtime corpora
        run: just verify

  publish-crates:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # pnpm needs the workspace installed to rewrite `workspace:*`
      # dependency ranges into real versions at pack time.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks

  github-release:
    needs: [publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
