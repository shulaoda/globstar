name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Static checks, docs and the cross-runtime fuzz smoke, once.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: just lint
      - name: Rust docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Docs site
        run: pnpm docs:build
      # A new seed every run, printed in the log so a failure replays
      # with `just fuzz --seed N`.
      - name: Fuzz (smoke)
        run: just fuzz --count 20000 --seed ${{ github.run_number }}

  # The Rust and JS suites plus the cross-runtime verify on every
  # platform; Windows is the only place `corpus-windows.txt` and the
  # `\`-separator paths run.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace
      - run: node packages/globstar/tests/compiler-stages.mjs
      - run: node packages/globstar/tests/string-mode.mjs
      - run: node packages/globstar/tests/dir-exhaustive.mjs
      - run: node packages/globstar/tests/dir-match.mjs
      - run: node packages/globstar/tests/large.mjs
      - run: node packages/globstar-walk/tests/walk.mjs
      - run: node scripts/verify.mjs
