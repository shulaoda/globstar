[package]
name = "globstar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Cross-platform, high-performance glob matching library."

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
globset = "0.4"
fast-glob = "0.4"
wax = "0.6"
glob = "0.3"

[[bench]]
name = "matcher_single"
harness = false

[[bench]]
name = "matcher_multi"
harness = false

[[bench]]
name = "compiler_stages"
harness = false

[lints.rust]
unsafe_code = "forbid"
