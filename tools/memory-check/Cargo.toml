[package]
name = "memory-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
globstar = { path = "../../crates/globstar" }
globset = "0.4"
wax = "0.6"

[dev-dependencies]
globstar-walk = { path = "../../crates/globstar-walk" }

# Single-pattern memory: globstar vs globset / wax, on the rows of
# `fixtures/bench-single.tsv`.
[[bin]]
name = "matcher-single-memory"
path = "src/matcher_single_memory.rs"

# Multi-pattern memory: globstar (union) vs globset / wax,
# on the sets of `fixtures/bench-sets.tsv` and the two list files.
[[bin]]
name = "matcher-multi-memory"
path = "src/matcher_multi_memory.rs"
